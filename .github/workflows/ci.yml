name: Maintainers Copilot CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: maintainers
          POSTGRES_PASSWORD: maintainers-local-password
          POSTGRES_DB: maintainers
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U maintainers -d maintainers"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://maintainers:maintainers-local-password@localhost:5432/maintainers
      REDIS_URL: redis://localhost:6379/0
      VAULT_ADDR: http://localhost:8200
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: maintainers-copilot

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn httpx "psycopg[binary]" numpy redis pyyaml pytest streamlit minio openai

      - name: Verify required RAG chunk file exists
        run: |
          test -f data/processed/pandas_chunks.jsonl

      - name: Compile core Python files
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/services/chat_service.py
          python -m py_compile app/infra/rag.py
          python -m py_compile app/infra/redaction.py
          python -m py_compile app/repositories/memory_repository.py
          python -m py_compile app/repositories/widget_repository.py
          python -m py_compile evals/run_rag_eval.py

      - name: Run redaction tests
        run: |
          python -m pytest tests/test_redaction.py -q

      - name: Prepare memory tables
        run: |
          python scripts/setup_memory_tables.py

      - name: Prepare widget config table
        run: |
          python scripts/setup_widget_tables.py

      - name: Ingest RAG chunks into pgvector
        run: |
          python scripts/ingest_corpus.py --dev-embeddings --database-url "$DATABASE_URL"

      - name: Run RAG eval gate
        run: |
          python evals/run_rag_eval.py

      - name: Upload eval report as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_report.json