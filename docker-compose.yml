services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - .:/workspace
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio:
        condition: service_started
      vault:
        condition: service_started

  chatbot:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: streamlit run frontend/streamlit_app/Home.py --server.address 0.0.0.0 --server.port 8501
    env_file: .env
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - .:/workspace
    depends_on:
      - api

  widget:
    build:
      context: frontend/widget
      dockerfile: ../../docker/widget.Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/widget:/workspace

  host:
    image: nginx:1.27-alpine
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./demo/host:/usr/share/nginx/html:ro
    depends_on:
      - api

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: alembic upgrade head
    env_file: .env
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_started

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: maintainers
      POSTGRES_USER: maintainers
      POSTGRES_PASSWORD: maintainers-local-password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintainers -d maintainers"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  vault:
    image: hashicorp/vault:1.17
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"

volumes:
  pgdata:
  miniodata:

